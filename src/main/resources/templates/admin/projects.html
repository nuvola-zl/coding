<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作品管理 · 个人主页</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<main class="page">

    <div class="banner" th:if="${saved}">已保存。</div>
    <div class="banner" th:if="${deleted}">已删除。</div>

    <div class="toolbar">
        <div>
            <h1>作品管理</h1>
            <p class="auth-sub">草稿不会出现在主页，发布后访客才能看到。</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/projects/new}">+ 新建作品</a>
    </div>

    <div class="table-wrap" th:if="${!#lists.isEmpty(projects)}">
        <table class="data">
            <thead>
            <tr>
                <th>标题</th>
                <th>状态</th>
                <th class="num">排序</th>
                <th>更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td>
                    <a th:if="${p.status == 'PUBLISHED'}" th:href="@{|/projects/${p.id}|}"
                       target="_blank" th:text="${p.title}">标题</a>
                    <span th:if="${p.status != 'PUBLISHED'}" th:text="${p.title}">标题</span>
                </td>
                <td>
                    <span class="pill" th:classappend="${p.status == 'PUBLISHED'} ? 'pill-pub' : 'pill-draft'"
                          th:text="${p.statusLabel}">状态</span>
                </td>
                <td class="num" th:text="${p.sortOrder}">0</td>
                <td class="muted" th:text="${p.updateTimeText}">2026-11-08 14:00</td>
                <td>
                    <div class="row-actions">
                        <a th:href="@{|/admin/projects/${p.id}/edit|}">编辑</a>
                        <form th:action="@{|/admin/projects/${p.id}/delete|}" method="post"
                              onsubmit="return confirm('确定删除这个作品吗？删除后主页将不再显示。');">
                            <button class="link-danger" type="submit">删除</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="empty" th:if="${#lists.isEmpty(projects)}">还没有作品，点右上角新建一个。</p>

    <p style="margin-top:26px"><a class="back" th:href="@{/}">← 返回主页</a></p>

</main>

<div th:replace="~{fragments/layout :: foot}"></div>

</body>
</html>
