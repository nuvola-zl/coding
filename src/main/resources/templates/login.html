<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 个人主页</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">

        <div class="auth-brand">
            <span class="brand-mark">L</span>
            <span>个人主页</span>
        </div>

        <h1>登录</h1>
        <p class="auth-sub">浏览不需要登录，修改内容才需要。</p>

        <div class="banner banner-warn" th:if="${needLogin}">
            请先登录，登录成功后会自动回到刚才的页面。
        </div>
        <div class="banner banner-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" th:object="${form}" method="post">
            <input type="hidden" name="redirect" th:if="${redirect != null}" th:value="${redirect}">

            <div class="field">
                <label for="username">账号</label>
                <input id="username" type="text" th:field="*{username}"
                       autocomplete="username" autofocus placeholder="请输入账号">
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="field">
                <label for="password">密码</label>
                <input id="password" type="password" th:field="*{password}"
                       autocomplete="current-password" placeholder="请输入密码">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button class="btn btn-primary btn-block" type="submit">登录</button>
        </form>

        <p class="auth-foot"><a th:href="@{/}">← 返回主页</a></p>
    </div>
</div>

</body>
</html>
